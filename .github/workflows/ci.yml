name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner: Intel for routine CI; ARM64 for release validation'
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-15
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: true
jobs:
  macos:
    # Keep routine CI independent of the constrained ARM64 runner pool.
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          uname -m
          swift --version
      - name: Tests
        run: bash scripts/test.sh
      - name: Build and package
        run: bash scripts/package-release.sh
      - name: Upload installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tickfin-${{ runner.arch }}
          path: |
            dist/Tickfin-*.dmg
            dist/Tickfin-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
